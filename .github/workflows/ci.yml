name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  services:
    name: Java services
    runs-on: ubuntu-latest
    services:
      # The streaming ingest test writes through the real sink, whose idempotency is a
      # PostgreSQL `on conflict` upsert. It skips itself when no database is reachable, so
      # without this container it would quietly stop covering anything.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gsih
          POSTGRES_USER: gsih
          POSTGRES_PASSWORD: gsih
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gsih"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Create the warehouse schema
        # Flyway owns the schema and lives in the API module, so the API applies it once
        # before the ingest tests write into it.
        run: |
          mvn -B -f services/pom.xml -q -DskipTests package
          SPRING_PROFILES_ACTIVE=local \
          GSIH_DB_URL=jdbc:postgresql://localhost:5432/gsih \
          timeout 180 java -jar services/gsih-investigations-api/target/gsih-investigations-api-*.jar \
            --spring.main.web-application-type=none &
          for _ in $(seq 1 40); do
            if PGPASSWORD=gsih psql -h localhost -U gsih -d gsih -tAc \
                "select count(*) from flyway_schema_history where success" | grep -qv '^0$'; then
              echo "schema ready"; break
            fi
            sleep 3
          done
      - name: Build and test
        env:
          GSIH_TEST_DB_URL: jdbc:postgresql://localhost:5432/gsih
        run: mvn -B -f services/pom.xml verify
      - name: Fail if the streaming path skipped instead of running
        # An integration test that silently skips is worse than one that does not exist:
        # the summary says "passed" either way.
        run: |
          report=services/gsih-ingest-service/target/surefire-reports/com.att.gsih.ingest.StreamingIngestTest.txt
          grep -q "Skipped: 0" "$report" || { echo "streaming ingest test skipped"; cat "$report"; exit 1; }

  infra:
    name: Infrastructure definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform formatting and validity
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Kubernetes manifests against the API schemas
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.29.0 infra/k8s/*.yaml
      - name: Word document structure
        run: |
          python3 docs/verify_spec_doc.py docs/GSIH-Platform-Specification.docx
          python3 docs/verify_spec_doc.py docs/GSIH-Executive-Brief.docx

  analytics:
    name: Predictive analytics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e "analytics[dev]"
      - name: Test
        run: pytest analytics/tests -q

  mapping-parity:
    name: Streaming / batch mapping parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      # Guards the one place the platform duplicates logic: the canonical vocabularies in
      # the Java mapper and the Spark silver job must stay identical.
      - name: Compare mapping tables
        run: pytest pipelines/tests -q

  web:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  migrations:
    name: Flyway migrations against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gsih
          POSTGRES_USER: gsih
          POSTGRES_PASSWORD: gsih
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gsih"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      # The unit suite runs on H2 for speed; the migrations themselves are PostgreSQL and
      # have to be proved against the real engine, including Hibernate's schema validation.
      - name: Apply migrations and validate the entity mapping
        run: |
          mvn -B -f services/pom.xml -q -DskipTests package
          SPRING_PROFILES_ACTIVE=local \
          GSIH_DB_URL=jdbc:postgresql://localhost:5432/gsih \
          timeout 120 java -jar services/gsih-investigations-api/target/*.jar \
            --spring.main.web-application-type=none --spring.main.register-shutdown-hook=true &
          for _ in $(seq 1 40); do
            if PGPASSWORD=gsih psql -h localhost -U gsih -d gsih -tAc \
                "select count(*) from flyway_schema_history where success" | grep -q '^1$'; then
              echo "migrations applied"; exit 0
            fi
            sleep 3
          done
          echo "migrations did not complete"; exit 1
