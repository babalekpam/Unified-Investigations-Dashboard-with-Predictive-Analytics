[project]
name = "gsih-analytics"
version = "1.0.0"
description = "Predictive analytics for the Global Security Intelligence Hub (Section 6)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "mlflow-skinny>=2.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
gsih-train = "gsih_analytics.train:main"
gsih-score = "gsih_analytics.scoring:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gsih_analytics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
