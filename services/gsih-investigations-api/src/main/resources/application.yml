spring:
  application:
    name: gsih-investigations-api
  profiles:
    default: local
  datasource:
    url: ${GSIH_DB_URL:jdbc:postgresql://localhost:5432/gsih}
    username: ${GSIH_DB_USER:gsih}
    password: ${GSIH_DB_PASSWORD:gsih}
    hikari:
      maximum-pool-size: 10
      pool-name: gsih-serving
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: gsih-investigations-api

gsih:
  cors:
    allowed-origins: ${GSIH_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.att.gsih: INFO

---
# Laptop / docker-compose demo. Tokens are signed with a symmetric key instead of Entra ID.
spring:
  config:
    activate:
      on-profile: local

gsih:
  security:
    local-signing-key: ${GSIH_LOCAL_SIGNING_KEY:local-demo-signing-key-change-me-0123456789}

---
# Deployed environments: Microsoft Entra ID is the token issuer, no local key exists.
spring:
  config:
    activate:
      on-profile: azure
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${GSIH_ENTRA_ISSUER_URI}
          audiences: ${GSIH_ENTRA_AUDIENCE}
