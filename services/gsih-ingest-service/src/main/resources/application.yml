spring:
  application:
    name: gsih-ingest-service
  datasource:
    url: ${GSIH_DB_URL:jdbc:postgresql://localhost:5432/gsih}
    username: ${GSIH_DB_USER:gsih}
    password: ${GSIH_DB_PASSWORD:gsih}
    hikari:
      maximum-pool-size: 8
      pool-name: gsih-ingest
  kafka:
    bootstrap-servers: ${GSIH_KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: gsih-ingest
      max-poll-records: 500
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    listener:
      ack-mode: batch

server:
  port: ${PORT:8081}
  shutdown: graceful

gsih:
  ingest:
    # Deployment-wide salt for badge pseudonymisation (Section 5.3, data minimisation).
    # Sourced from Azure Key Vault in every deployed environment; rotating it re-keys the hashes,
    # so it is versioned alongside the warehouse rather than changed casually.
    badge-salt: ${GSIH_BADGE_SALT:local-demo-badge-salt}
    site-refresh-ms: 900000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.att.gsih: INFO
    org.apache.kafka: WARN
